# Base for United Arab Emirates packs: a VAT-registered trading business in Dubai.
# VAT is fixed pack data, never fetched.
schema_version: 1
id: ae_trading
locale: AE                          # country: tax, addresses, names, fiscal year (erpnext_demo_gen/locales)
default_pack: furniture_store       # installed by --country AE when no --pack is given
abstract: true
pack_version: 1
title: UAE Trading (base, Dubai)

# Standard rate since 2018, with input credit; prices to consumers include VAT.
vat: {rate: 5, as_of: "2026-11-10"}

company:
  industry_nouns: [Trading]
  home_state: Dubai                 # an emirate (--home-state DU, AZ, SH, ...)
  warehouses: [Stores]
  funding: {share_capital: 1000000, term_loan: 0}

parties:
  customer_nouns: [Trading, General Trading, Contracting, Interiors, Stores]
  supplier_nouns: [Industries, Manufacturing, Trading, Factory]
  customer_group: {b2b: Commercial, b2c: Individual}
  supplier_group: Distributor
  supplier_home_state_share: 0.5    # others in Sharjah, Ajman, Abu Dhabi, ... (all VAT-registered)
  walk_in_customer: false

behavior:
  # index 0 = January: Dubai Shopping Festival (Dec-Jan), slow summer (Jul-Aug)
  seasonality: {monthly_index: [1.2, 1.0, 1.0, 0.9, 0.9, 0.8, 0.7, 0.7, 0.9, 1.0, 1.1, 1.3]}
  customer_skew: {distribution: pareto, alpha: 1.2}
  geography: {home_state_share: 0.65}
  vat_registration: {registered: 0.85, unregistered: 0.15}   # business customers with a TRN
  payment_outcomes: {on_time: 0.70, late: 0.20, open_overdue: 0.10}
  rates: {returns: 0.02, cancelled: 0.01, left_in_draft: 0.02}

banking:
  # Real bank names and their IBAN bank codes and SWIFT codes; account numbers are made up.
  main: {bank: Emirates NBD, short: ENBD, bank_code: "260", swift: EBILAEAD}
  collection: {bank: Mashreq Bank, short: Mashreq, bank_code: "033", swift: BOMLAEAD}   # card terminal settles here
  sweep_weekday: 0            # every Monday the collection account and the cash go to the main account
  cash_floor: 50000           # lowest planned bank balance (AED); the term loan grows in these steps
  modes:
    counter:  {Cash: 0.30, Card: 0.70}
    customer: {Wire Transfer: 0.60, Cheque: 0.40}
    supplier: {Wire Transfer: 0.75, Cheque: 0.25}
  clearing_days: {Wire Transfer: [0, 1], Card: [1, 2], Cheque: [1, 3]}

# Own-use inventory (design 5.15); VAT on supplies is recoverable like any other input.
supplies:
  warehouse: Office Stores
  item_group: Office Supplies
  expense_account: Office Maintenance Expenses      # default; stationery goes to Print and Stationery
  departments: [Sales, Accounts, Warehouse]
  suppliers:
    - {nouns: [Stationery, Office Supplies]}
    - {nouns: [Water, Drinking Water]}
  items:
    - {code: SUP-A4-PAPER,   name: "A4 Copier Paper (box of 5 reams)", cost: 75,  use_per_month: [3, 6], reorder: {level: 4, qty: 10}, expense_account: Print and Stationery}
    - {code: SUP-TONER,      name: "Laser Printer Toner Cartridge",    cost: 350, use_per_month: [1, 2], reorder: {level: 2, qty: 4},  expense_account: Print and Stationery}
    - {code: SUP-PENS,       name: "Ballpoint Pens (box of 12)",       cost: 20,  use_per_month: [2, 5], reorder: {level: 4, qty: 12}, expense_account: Print and Stationery}
    - {code: SUP-CLEANER,    name: "Floor Cleaner (5 L)",              cost: 25,  use_per_month: [1, 3], reorder: {level: 2, qty: 6}}
    - {code: SUP-BIN-BAGS,   name: "Garbage Bags (pack of 50)",        cost: 30,  use_per_month: [2, 4], reorder: {level: 3, qty: 10}}
    - {code: SUP-COFFEE,     name: "Arabic Coffee (1 kg)",             cost: 45,  use_per_month: [1, 3], reorder: {level: 2, qty: 6}}
    - {code: SUP-WATER,      name: "Drinking Water (5 gal)",           cost: 12,  use_per_month: [12, 20], stock: false, supplier: 2}

sizes:
  small:  {months: 3,  customers: 6,   suppliers: 3,  items: 12,  sales_invoices: 35,   purchase_invoices: 12}   # quick tests, about 1 minute
  medium: {months: 12, customers: 15,  suppliers: 8,  items: 40,  sales_invoices: 150,  purchase_invoices: 60}
  large:  {months: 24, customers: 150, suppliers: 30, items: 250, sales_invoices: 4000, purchase_invoices: 900}
