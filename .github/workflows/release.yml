name: Snapshots release

# Publishes ready-made snapshots: medium and large for every country and pack, one job
# each. Each snapshot is restored on a new site and verified; a set is published only
# when all ten pass. App versions (tags vX.Y.Z) are released separately and carry no
# snapshots.
#
#   monthly (1st)     version-16: a new release snapshots-YYYY-MM built on the current
#                     version-16 of Frappe, ERPNext and india_compliance. The three newest
#                     sets are kept, so benches on an earlier version-16 minor release can
#                     use an older set (restore migrates forward).
#   weekly (Sunday)   develop: the rolling pre-release develop-snapshots, rebuilt on
#                     develop; its files are replaced each time.
#   workflow_dispatch either channel; a second monthly run in a month replaces that
#                     month's files.

on:
  schedule:
    - cron: "0 0 1 * *" # monthly, 05:30 IST on the 1st: version-16 set
    - cron: "30 22 * * 6" # weekly, Sunday 04:00 IST: develop set
  workflow_dispatch:
    inputs:
      channel:
        description: monthly (version-16 set) or develop (rolling pre-release)
        type: choice
        default: monthly
        options: [monthly, develop]

permissions:
  contents: write

env:
  DB_ROOT_PASSWORD: root
  BENCH: /home/runner/frappe-bench
  GH_TOKEN: ${{ github.token }}
  CHANNEL: ${{ inputs.channel || (github.event.schedule == '0 0 1 * *' && 'monthly') || 'develop' }}
  KEEP_MONTHS: 3

concurrency:
  group: snapshots-${{ inputs.channel || (github.event.schedule == '0 0 1 * *' && 'monthly') || 'develop' }}
  cancel-in-progress: false

jobs:
  draft:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      branch: ${{ steps.tag.outputs.branch }}
    steps:
      - name: Tag and Frappe branch
        id: tag
        run: |
          if [ "$CHANNEL" = develop ]; then
            echo "tag=develop-snapshots" >> "$GITHUB_OUTPUT"
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          else
            echo "tag=snapshots-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
            echo "branch=version-16" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the release if missing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; its snapshots will be replaced"
          elif [ "$CHANNEL" = develop ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Develop snapshots (rolling)" --notes "Snapshots are being built."
          else
            # a draft until all ten pass
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --latest=false \
              --target "$GITHUB_SHA" --title "Snapshots ${TAG#snapshots-} (Frappe/ERPNext version-16)" \
              --notes "Snapshots are being built."
          fi

  snapshot:
    name: ${{ needs.draft.outputs.branch }} ${{ matrix.target.country }} ${{ matrix.target.pack }} ${{ matrix.size }}
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        size: [medium, large]
        target:
          - {country: IN, pack: furniture_store}
          - {country: IN, pack: electrical_distributor}
          - {country: US, pack: furniture_store}
          - {country: AE, pack: furniture_store}
          - {country: DE, pack: furniture_store}
    env:
      FRAPPE_BRANCH: ${{ needs.draft.outputs.branch }}
      SKIP_SITES: "1"
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bench
      - name: Build the snapshot
        working-directory: ${{ env.BENCH }}
        run: |
          bench demo-gen snapshot build --country "${{ matrix.target.country }}" --pack "${{ matrix.target.pack }}" \
            --size "${{ matrix.size }}" --db-root-password "$DB_ROOT_PASSWORD" --mariadb-user-host-login-scope '%'
      - name: Restore check
        working-directory: ${{ env.BENCH }}
        run: |
          # snapshot new-site checks the checksum and versions, restores and runs verify
          dump=$(ls demo-snapshots/*.sql.gz)
          bench demo-gen snapshot new-site restore-check.localhost "$PWD/$dump" \
            --admin-password restore-check --db-root-password "$DB_ROOT_PASSWORD" \
            --mariadb-user-host-login-scope '%'
      # Hand the files to the publish job, which attaches all ten only when every job passed.
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target.country }}-${{ matrix.target.pack }}-${{ matrix.size }}
          path: ${{ env.BENCH }}/demo-snapshots/
          retention-days: 3

  publish:
    name: Publish
    needs: [draft, snapshot]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: snapshots
          merge-multiple: true
      - name: Replace the release's snapshots
        run: |
          ls -l snapshots
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber snapshots/*
          # then remove files of earlier builds of the same release, so it is never empty in between
          for old in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "snapshots/$old" ] || gh release delete-asset "$TAG" "$old" -R "$GITHUB_REPOSITORY" --yes
          done
      - name: Write the notes and publish
        run: |
          cd snapshots
          python3 - > ../notes.md <<'EOF'
          import json, glob, os
          tag, repo, channel = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"], os.environ["CHANNEL"]
          rows = [json.load(open(f)) for f in sorted(glob.glob("*.json"))]
          names = {"IN": "India", "US": "United States", "AE": "UAE", "DE": "Germany"}
          order = list(names)
          built = rows[0]["built_at"][:10]
          if channel == "develop":
              print(f"Demo snapshots for Frappe/ERPNext **develop** (the next major version), built {built}.")
              print("Rebuilt every week; its files are replaced each time.\n")
          else:
              print(f"Demo snapshots for **Frappe/ERPNext version-16**, built {built}. A new set is")
              print("published every month and the last three are kept. See the README's")
              print("\"Download a ready-made snapshot\" section.\n")
          print("## Built on\n")
          for app in ("frappe", "erpnext", "india_compliance", "erpnext_demo_gen"):
              info = next((m["apps"][app] for m in rows if app in m["apps"]), None)
              if info:
                  when = f", {info['date'][:10]}" if info.get("date") else ""
                  only = ", India snapshots only" if app == "india_compliance" else ""
                  print(f"- {app} {info['version']} ({info['commit']}{when}){only}")
          print(f"- MariaDB {rows[0]['mariadb']}\n")
          if channel == "develop":
              print("Restores on a develop bench at the commits above or newer (`bench update` first);")
              print("the site is migrated after restore.\n")
          else:
              print("Restores on a bench with these Frappe and ERPNext versions or later ones of version-16:")
              print("restoring migrates it forward. For an earlier version-16 minor release of Frappe or")
              print("ERPNext, use an older `snapshots-YYYY-MM` set.\n")
          print("## Snapshots\n")
          for m in sorted(rows, key=lambda m: (order.index(m["country"]), m["pack_name"], m["size"] != "medium")):
              docs = sum(m["documents"].values())
              print(f"- **{names[m['country']]}, {m['pack_name']}, {m['size']}**: "
                    f"{m['company']}, {docs:,} documents, data {m['data_from']} to {m['data_to']}  ")
              print(f"  `{m['dump']}`")
          print("\n## Restore\n")
          print("```bash")
          print(f"gh release download {tag} -R {repo} -p '*furniture_store-IN-large*'")
          print("bench demo-gen snapshot new-site mydemo.localhost demo-furniture_store-IN-large-*.sql.gz")
          print("```\n")
          print("- India snapshots need india_compliance on the bench.")
          print("- The Administrator password is `changeme` unless you pass `--admin-password`.")
          print("- The data is fictional. Each `.json` manifest has the checksum, app commits and document counts.")
          EOF
          cd ..
          cat notes.md
          if [ "$CHANNEL" = develop ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease --latest=false
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest=false
          fi
      - name: Keep the newest monthly sets
        if: env.CHANNEL == 'monthly'
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft | not) | .tagName' \
            | { grep -E '^snapshots-[0-9]{4}-[0-9]{2}$' || true; } | sort -r | tail -n +$((KEEP_MONTHS + 1)) \
            | while read -r old; do
                echo "removing $old"
                gh release delete "$old" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
