name: Release

# Builds and publishes snapshots: Small and Medium for every country and pack, one
# job each. Each snapshot is restored on a new site and verified before it is attached.
#
#   tag vX.Y.Z        version-16 release: a draft release, published with notes when all
#                     ten pass. The tag must match erpnext_demo_gen.__version__.
#   weekly (Sunday)   develop snapshots: the rolling pre-release "develop-snapshots" is
#                     rebuilt on Frappe/ERPNext/india_compliance develop; its files are
#                     replaced only when all ten pass.
#   workflow_dispatch either channel ("release" needs an existing tag).

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "30 22 * * 6" # Sunday 04:00 IST, after CI's weekly Medium run
  workflow_dispatch:
    inputs:
      channel:
        description: release (a version-16 tag) or develop (the rolling pre-release)
        type: choice
        default: develop
        options: [develop, release]
      tag:
        description: For release, the existing tag to (re)build, e.g. v0.1.0
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.channel || (github.event_name == 'schedule' && 'develop') || 'release' }}
  cancel-in-progress: false

env:
  DB_ROOT_PASSWORD: root
  BENCH: /home/runner/frappe-bench
  GH_TOKEN: ${{ github.token }}
  CHANNEL: ${{ inputs.channel || (github.event_name == 'schedule' && 'develop') || 'release' }}
  DEVELOP_TAG: develop-snapshots

jobs:
  draft:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
      branch: ${{ steps.tag.outputs.branch }}
    steps:
      - name: Tag, app ref and Frappe branch
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$CHANNEL" = develop ]; then
            echo "tag=$DEVELOP_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          else
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "branch=version-16" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.ref }}
      - name: Tag matches the app version
        if: env.CHANNEL == 'release'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' erpnext_demo_gen/__init__.py)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match __version__ $version"
            exit 1
          fi
      - name: Create the release if missing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; its snapshots will be replaced"
          elif [ "$CHANNEL" = develop ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Develop snapshots (rolling)" --notes "Snapshots are being built."
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$TAG" --notes "Snapshots are being built."
          fi

  snapshot:
    name: ${{ needs.draft.outputs.branch }} ${{ matrix.target.country }} ${{ matrix.target.pack }} ${{ matrix.size }}
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        size: [small, medium]
        target:
          - {country: IN, pack: furniture_store}
          - {country: IN, pack: electrical_distributor}
          - {country: US, pack: furniture_store}
          - {country: AE, pack: furniture_store}
          - {country: DE, pack: furniture_store}
    env:
      FRAPPE_BRANCH: ${{ needs.draft.outputs.branch }}
      SKIP_SITES: "1"
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.draft.outputs.ref }}
      - uses: ./.github/actions/setup-bench
      - name: Build the snapshot
        working-directory: ${{ env.BENCH }}
        run: |
          bench demo-gen snapshot build --country "${{ matrix.target.country }}" --pack "${{ matrix.target.pack }}" \
            --size "${{ matrix.size }}" --db-root-password "$DB_ROOT_PASSWORD" --mariadb-user-host-login-scope '%'
      - name: Restore check
        working-directory: ${{ env.BENCH }}
        run: |
          # snapshot new-site checks the checksum and versions, restores and runs verify
          dump=$(ls demo-snapshots/*.sql.gz)
          bench demo-gen snapshot new-site restore-check.localhost "$PWD/$dump" \
            --admin-password restore-check --db-root-password "$DB_ROOT_PASSWORD" \
            --mariadb-user-host-login-scope '%'
      # Hand the files to the publish job, which attaches all ten only when every job passed.
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target.country }}-${{ matrix.target.pack }}-${{ matrix.size }}
          path: ${{ env.BENCH }}/demo-snapshots/
          retention-days: 3

  publish:
    name: Publish
    needs: [draft, snapshot]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: snapshots
          merge-multiple: true
      - name: Replace the release's snapshots
        run: |
          ls -l snapshots
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber snapshots/*
          # then remove files of earlier builds (develop is rebuilt weekly), so the
          # release is never empty in between
          for old in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "snapshots/$old" ] || gh release delete-asset "$TAG" "$old" -R "$GITHUB_REPOSITORY" --yes
          done
      - name: Write the notes and publish
        run: |
          cd snapshots
          python3 - > ../notes.md <<'EOF'
          import json, glob, os
          tag, repo, channel = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"], os.environ["CHANNEL"]
          rows = [json.load(open(f)) for f in sorted(glob.glob("*.json"))]
          names = {"IN": "India", "US": "United States", "AE": "UAE", "DE": "Germany"}
          order = list(names)
          if channel == "develop":
              print("Rolling snapshots for Frappe/ERPNext **develop** (the next major version), rebuilt")
              print("every week. For a released version, use the latest versioned release instead.\n")
          else:
              print("Ready-made demo sites for ERPNext. Restore one in about 15 seconds instead of")
              print("installing for minutes or hours. See the README's Snapshots section.\n")
          print("## Snapshots\n")
          for m in sorted(rows, key=lambda m: (order.index(m["country"]), m["pack_name"], m["size"] != "small")):
              docs = sum(m["documents"].values())
              print(f"- **{names[m['country']]}, {m['pack_name']}, {m['size']}**: "
                    f"{m['company']}, {docs:,} documents, data {m['data_from']} to {m['data_to']}  ")
              print(f"  `{m['dump']}`")
          print("\n## Built on\n")
          for app in ("frappe", "erpnext", "erpnext_demo_gen", "india_compliance"):
              info = next((m["apps"][app] for m in rows if app in m["apps"]), None)
              if info:
                  when = f", {info['date'][:10]}" if info.get("date") else ""
                  only = ", India snapshots only" if app == "india_compliance" else ""
                  print(f"- {app} {info['version']} ({info['commit']}{when}){only}")
          print(f"- MariaDB {rows[0]['mariadb']}")
          print("\n## Restore\n")
          print("```bash")
          print(f"gh release download {tag} -R {repo} -p '*furniture_store-IN-small*'")
          print("bench demo-gen snapshot new-site mydemo.localhost demo-furniture_store-IN-small-*.sql.gz")
          print("```\n")
          if channel == "develop":
              print("- Needs a develop bench at the commits above or newer (`bench update` first);")
              print("  the site is migrated after restore. A version-16 bench is refused.")
          else:
              print("- Restores on a v16 bench at the release above or newer (the site is migrated after restore).")
              print("  An older bench, or another major version, is refused.")
          print("- India snapshots need india_compliance on the bench.")
          print("- The Administrator password is `changeme` unless you pass `--admin-password`.")
          print("- The data is fictional. Each `.json` manifest has the checksum, app commits and document counts.")
          EOF
          cd ..
          cat notes.md
          if [ "$CHANNEL" = develop ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease --latest=false
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest
          fi
