name: CI

# Every push and pull request: unit tests and a small-size smoke test per pack (install,
# verify, uninstall, compare table counts), India, US, UAE and Germany, on Frappe,
# ERPNext and india_compliance version-16 and again on develop (the next major
# version). develop failures are reported but do not fail the run: they warn early
# about changes coming in the next major version.
#
# Snapshots (one job each; every snapshot is restored on a new site and verified,
# then kept as a build artifact for 14 days):
#   nightly          medium, every country and pack, on version-16 and develop;
#                    large on version-16. A snapshot is skipped when neither upstream
#                    (frappe, erpnext, india_compliance) nor this app changed since
#                    its last successful nightly build. On Sunday (IST) the large
#                    ones are built regardless, so their data is never more than a
#                    week old. (develop's large snapshots are built by release.yml.)
#   workflow_dispatch  any size, branch and country, never skipped.
# A failure means ERPNext, india_compliance or this app has drifted.
#
# Large version-16 snapshots built on main are also published to the rolling
# pre-release nightly-v16: each new file replaces the earlier build of the same
# country and pack, so the release always holds the newest verified build of each.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "license.txt"] # docs-only commits need no tests
  pull_request:
    paths-ignore: ["**.md", "license.txt"]
  schedule:
    - cron: "30 20 * * *" # nightly, 02:00 IST: tests and snapshots
  workflow_dispatch:
    inputs:
      snapshots:
        description: Snapshots to build after the tests
        type: choice
        default: none
        options: [none, small, medium, medium+large, large]
      branch:
        description: Frappe/ERPNext branch for the snapshots
        type: choice
        default: version-16
        options: [version-16, develop, both]
      country:
        description: Country of the snapshots (all its packs)
        type: choice
        default: all
        options: [all, IN, US, AE, DE]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # pushes replace older pushes; scheduled and manual runs queue instead
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DB_ROOT_PASSWORD: root
  BENCH: /home/runner/frappe-bench

jobs:
  tests:
    name: Unit and smoke tests (${{ matrix.frappe_branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        frappe_branch: [version-16, develop]
    continue-on-error: ${{ matrix.frappe_branch == 'develop' }}
    env:
      FRAPPE_BRANCH: ${{ matrix.frappe_branch }}
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bench
      - name: Unit tests
        working-directory: ${{ env.BENCH }}
        run: bench --site ci.localhost run-tests --app erpnext_demo_gen
      - name: Smoke test, furniture_store small
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN furniture_store small 1
      - name: Smoke test, electrical_distributor small
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN electrical_distributor small 1
      - name: Smoke test, furniture_store small in the wizard company (made-up GSTIN address)
        working-directory: ${{ env.BENCH }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN furniture_store small 1 ci.localhost '"use_wizard_company": True'
      - name: Smoke test, furniture_store small, unregistered (no GST)
        working-directory: ${{ env.BENCH }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN furniture_store small 1 ci.localhost '"unregistered": True'
      - name: Smoke test, furniture_store_us small (US site)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" US furniture_store small 1 ci-us.localhost
      - name: Smoke test, furniture_store (AE) small (UAE site)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" AE furniture_store small 1 ci-ae.localhost
      - name: Smoke test, furniture_store (AE) small, unregistered (UAE site)
        working-directory: ${{ env.BENCH }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" AE furniture_store small 1 ci-ae.localhost '"unregistered": True'
      - name: Smoke test, furniture_store (DE) small (Germany site)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" DE furniture_store small 1 ci-de.localhost
      - name: Smoke test, furniture_store (DE) small, Kleinunternehmer (Germany site)
        working-directory: ${{ env.BENCH }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" DE furniture_store small 1 ci-de.localhost '"unregistered": True'

  plan:
    name: Plan snapshots
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.snapshots != 'none')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SIZES: ${{ inputs.snapshots }}
          BRANCH: ${{ inputs.branch }}
          COUNTRY: ${{ inputs.country }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          targets = [("IN", "furniture_store"), ("IN", "electrical_distributor"),
                     ("US", "furniture_store"), ("AE", "furniture_store"), ("DE", "furniture_store")]
          from datetime import datetime, timezone
          nightly = os.environ["EVENT"] == "schedule"
          if nightly:
              builds = [("version-16", "medium"), ("develop", "medium"), ("version-16", "large")]
              country = "all"
              # the run at 20:30 UTC on Saturday is Sunday 02:00 IST: the weekly forced build
              sunday = datetime.now(timezone.utc).weekday() == 5
          else:
              branch = os.environ["BRANCH"]
              branches = ["version-16", "develop"] if branch == "both" else [branch]
              builds = [(b, z) for b in branches for z in os.environ["SIZES"].split("+")]
              country, sunday = os.environ["COUNTRY"], False
          jobs = [
              {"branch": b, "country": c, "pack": p, "size": z, "nightly": nightly,
               "skip_unchanged": nightly and not (sunday and z == "large")}
              for b, z in builds for c, p in targets if country in ("all", c)
          ]
          print("matrix=" + json.dumps({"include": jobs}))
          EOF

  snapshots:
    name: Snapshot ${{ matrix.branch }} ${{ matrix.country }} ${{ matrix.pack }} ${{ matrix.size }}
    needs: [tests, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    continue-on-error: ${{ matrix.branch == 'develop' }}
    env:
      FRAPPE_BRANCH: ${{ matrix.branch }}
      SKIP_SITES: "1"
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - name: Upstream commits
        id: upstream
        run: |
          head() { git ls-remote "https://github.com/$1" "refs/heads/$FRAPPE_BRANCH" | cut -c1-12; }
          key="$(head frappe/frappe)-$(head frappe/erpnext)-$(head resilient-tech/india-compliance)-${GITHUB_SHA::12}"
          echo "key=nightly-${{ matrix.branch }}-${{ matrix.country }}-${{ matrix.pack }}-${{ matrix.size }}-$key" >> "$GITHUB_OUTPUT"
          echo "frappe, erpnext, india_compliance and this app at: $key"
      - name: Built already?
        id: seen
        if: matrix.skip_unchanged
        uses: actions/cache/restore@v4
        with:
          path: built.txt
          key: ${{ steps.upstream.outputs.key }}
          lookup-only: true
      - name: Skip (nothing changed since the last nightly build)
        if: steps.seen.outputs.cache-hit == 'true'
        run: |
          echo "::notice::${{ matrix.branch }} ${{ matrix.country }} ${{ matrix.pack }} ${{ matrix.size }} unchanged since the last nightly build; skipped"
      - uses: actions/checkout@v5
        if: steps.seen.outputs.cache-hit != 'true'
      - uses: ./.github/actions/setup-bench
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Build the snapshot
        if: steps.seen.outputs.cache-hit != 'true'
        working-directory: ${{ env.BENCH }}
        run: |
          bench demo-gen snapshot build --country "${{ matrix.country }}" --pack "${{ matrix.pack }}" \
            --size "${{ matrix.size }}" --db-root-password "$DB_ROOT_PASSWORD" --mariadb-user-host-login-scope '%'
      - name: Restore check
        if: steps.seen.outputs.cache-hit != 'true'
        working-directory: ${{ env.BENCH }}
        run: |
          # snapshot new-site checks the checksum and versions, restores and runs verify
          dump=$(ls demo-snapshots/*.sql.gz)
          bench demo-gen snapshot new-site restore-check.localhost "$PWD/$dump" \
            --admin-password restore-check --db-root-password "$DB_ROOT_PASSWORD" \
            --mariadb-user-host-login-scope '%'
      - uses: actions/upload-artifact@v6
        if: steps.seen.outputs.cache-hit != 'true'
        with:
          name: snapshot-${{ github.run_number }}-${{ matrix.branch }}-${{ matrix.country }}-${{ matrix.pack }}-${{ matrix.size }}
          path: ${{ env.BENCH }}/demo-snapshots/
          retention-days: 14
      - name: Remember this build
        if: matrix.nightly && steps.seen.outputs.cache-hit != 'true'
        run: date -u > built.txt
      - uses: actions/cache/save@v4
        if: matrix.nightly && steps.seen.outputs.cache-hit != 'true'
        continue-on-error: true # a forced Sunday build may find its key saved already
        with:
          path: built.txt
          key: ${{ steps.upstream.outputs.key }}

  publish-nightly:
    name: Publish nightly-v16
    # Runs even when a snapshot job failed: each file was restored and verified by its own
    # job, and a failed one simply keeps its earlier build in the release.
    needs: [plan, snapshots]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: nightly-v16
    steps:
      - name: Large version-16 snapshots built by this run
        id: built
        run: |
          mkdir -p artifacts snapshots
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -D artifacts \
            -p 'snapshot-*-version-16-*-large' || echo "none built in this run"
          find artifacts -type f \( -name '*.sql.gz' -o -name '*.json' \) -exec mv {} snapshots/ \;
          ls -l snapshots
          echo "count=$(ls snapshots/*.sql.gz 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Create the release if missing
        if: steps.built.outputs.count != '0'
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Nightly snapshots (Frappe/ERPNext version-16, large)" \
              --notes "Snapshots are being published."
      - name: Replace the snapshots that were rebuilt
        if: steps.built.outputs.count != '0'
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber snapshots/*
          # then remove the earlier build of each country and pack that was just uploaded
          existing=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for dump in snapshots/*.sql.gz; do
            prefix=$(basename "$dump" | sed -E 's/^(demo-.*-large)-s[0-9]+-.*/\1-/')
            for old in $existing; do
              case "$old" in
                "$prefix"*) [ -e "snapshots/$old" ] || gh release delete-asset "$TAG" "$old" -R "$GITHUB_REPOSITORY" --yes ;;
              esac
            done
          done
      - name: Write the notes
        if: steps.built.outputs.count != '0'
        run: |
          mkdir all && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.json' -D all
          cd all
          python3 - > ../notes.md <<'EOF'
          import json, glob, os
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          rows = [json.load(open(f)) for f in sorted(glob.glob("*.json"))]
          names = {"IN": "India", "US": "United States", "AE": "UAE", "DE": "Germany"}
          order = list(names)
          print("Large demo snapshots for **Frappe/ERPNext version-16**, built from this app's `main`.")
          print("A snapshot is rebuilt on a night when Frappe, ERPNext, india_compliance or this app")
          print("changed, and replaces its earlier build here. For dated, stable sets (medium and")
          print("large) see the monthly `snapshots-YYYY-MM` releases.\n")
          print("Update the app before restoring (`bench update --apps erpnext_demo_gen`): these")
          print("snapshots can be newer than the latest tagged version of the app.\n")
          print("## Snapshots\n")
          for m in sorted(rows, key=lambda m: (order.index(m["country"]), m["pack_name"])):
              docs = sum(m["documents"].values())
              apps = ", ".join(f"{a} {i['version']} ({i['commit']})" for a, i in m["apps"].items())
              print(f"- **{names[m['country']]}, {m['pack_name']}**: built {m['built_at'][:10]}, "
                    f"{m['company']}, {docs:,} documents, data {m['data_from']} to {m['data_to']}  ")
              print(f"  `{m['dump']}`  ")
              print(f"  {apps}")
          print("\n## Restore\n")
          print("```bash")
          print(f"gh release download {tag} -R {repo} -p '*furniture_store-IN-large*'")
          print("bench demo-gen snapshot new-site mydemo.localhost demo-furniture_store-IN-large-*.sql.gz")
          print("```\n")
          print("- India snapshots need india_compliance on the bench.")
          print("- The Administrator password is `changeme` unless you pass `--admin-password`.")
          print("- The data is fictional. Each `.json` manifest has the checksum, app commits and document counts.")
          EOF
          cd ..
          cat notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease --latest=false
