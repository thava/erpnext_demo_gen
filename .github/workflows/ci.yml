name: CI

# Every push and pull request: unit tests and a small-size smoke test per pack (install,
# verify, uninstall, compare table counts), India, US, UAE and Germany, on Frappe,
# ERPNext and india_compliance version-16 and again on develop (the next major
# version). develop failures are reported but do not fail the run: they warn early
# about changes coming in the next major version.
#
# Snapshots (one job each; every snapshot is restored on a new site and verified,
# then kept as a build artifact for 14 days):
#   nightly          medium, every country and pack, on version-16 and develop.
#                    A branch's jobs are skipped when neither upstream (frappe,
#                    erpnext, india_compliance) nor this app changed since the last
#                    successful nightly build of the same snapshot.
#   weekly           large, every country and pack, on version-16. (develop's
#                    large snapshots are built weekly by release.yml.)
#   workflow_dispatch  any size, branch and country, never skipped.
# A failure means ERPNext, india_compliance or this app has drifted (requirement M-13).

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "license.txt"] # docs-only commits need no tests
  pull_request:
    paths-ignore: ["**.md", "license.txt"]
  schedule:
    - cron: "30 20 * * *" # nightly, 02:00 IST: tests and medium snapshots
    - cron: "30 21 * * 6" # weekly, Sunday 03:00 IST: large snapshots on version-16
  workflow_dispatch:
    inputs:
      snapshots:
        description: Snapshots to build after the tests
        type: choice
        default: none
        options: [none, small, medium, medium+large, large]
      branch:
        description: Frappe/ERPNext branch for the snapshots
        type: choice
        default: version-16
        options: [version-16, develop, both]
      country:
        description: Country of the snapshots (all its packs)
        type: choice
        default: all
        options: [all, IN, US, AE, DE]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # pushes replace older pushes; scheduled and manual runs queue instead
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DB_ROOT_PASSWORD: root
  BENCH: /home/runner/frappe-bench

jobs:
  tests:
    name: Unit and smoke tests (${{ matrix.frappe_branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        frappe_branch: [version-16, develop]
    continue-on-error: ${{ matrix.frappe_branch == 'develop' }}
    env:
      FRAPPE_BRANCH: ${{ matrix.frappe_branch }}
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bench
      - name: Unit tests
        working-directory: ${{ env.BENCH }}
        run: bench --site ci.localhost run-tests --app erpnext_demo_gen
      - name: Smoke test, furniture_store small
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN furniture_store small 1
      - name: Smoke test, electrical_distributor small
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN electrical_distributor small 1
      - name: Smoke test, furniture_store small in the wizard company (made-up GSTIN address)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN furniture_store small 1 ci.localhost '"use_wizard_company": True'
      - name: Smoke test, furniture_store small, unregistered (no GST)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" IN furniture_store small 1 ci.localhost '"unregistered": True'
      - name: Smoke test, furniture_store_us small (US site)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" US furniture_store small 1 ci-us.localhost
      - name: Smoke test, furniture_store (AE) small (UAE site)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" AE furniture_store small 1 ci-ae.localhost
      - name: Smoke test, furniture_store (DE) small (Germany site)
        working-directory: ${{ env.BENCH }}
        run: bash "$GITHUB_WORKSPACE/.github/ci/smoke.sh" DE furniture_store small 1 ci-de.localhost

  plan:
    name: Plan snapshots
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.snapshots != 'none')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SIZES: ${{ inputs.snapshots }}
          BRANCH: ${{ inputs.branch }}
          COUNTRY: ${{ inputs.country }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          targets = [("IN", "furniture_store"), ("IN", "electrical_distributor"),
                     ("US", "furniture_store"), ("AE", "furniture_store"), ("DE", "furniture_store")]
          if os.environ["EVENT"] == "schedule":
              weekly = os.environ["SCHEDULE"] == "30 21 * * 6"
              sizes = ["large"] if weekly else ["medium"]
              branches = ["version-16"] if weekly else ["version-16", "develop"]
              country, skip_unchanged = "all", not weekly
          else:
              sizes = os.environ["SIZES"].split("+")
              branch = os.environ["BRANCH"]
              branches = ["version-16", "develop"] if branch == "both" else [branch]
              country, skip_unchanged = os.environ["COUNTRY"], False
          jobs = [
              {"branch": b, "country": c, "pack": p, "size": z, "skip_unchanged": skip_unchanged}
              for b in branches for z in sizes for c, p in targets if country in ("all", c)
          ]
          print("matrix=" + json.dumps({"include": jobs}))
          EOF

  snapshots:
    name: Snapshot ${{ matrix.branch }} ${{ matrix.country }} ${{ matrix.pack }} ${{ matrix.size }}
    needs: [tests, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    continue-on-error: ${{ matrix.branch == 'develop' }}
    env:
      FRAPPE_BRANCH: ${{ matrix.branch }}
      SKIP_SITES: "1"
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - name: Upstream commits
        id: upstream
        run: |
          head() { git ls-remote "https://github.com/$1" "refs/heads/$FRAPPE_BRANCH" | cut -c1-12; }
          key="$(head frappe/frappe)-$(head frappe/erpnext)-$(head resilient-tech/india-compliance)-${GITHUB_SHA::12}"
          echo "key=nightly-${{ matrix.branch }}-${{ matrix.country }}-${{ matrix.pack }}-${{ matrix.size }}-$key" >> "$GITHUB_OUTPUT"
          echo "frappe, erpnext, india_compliance and this app at: $key"
      - name: Built already?
        id: seen
        if: matrix.skip_unchanged
        uses: actions/cache/restore@v4
        with:
          path: built.txt
          key: ${{ steps.upstream.outputs.key }}
          lookup-only: true
      - name: Skip (nothing changed since the last nightly build)
        if: steps.seen.outputs.cache-hit == 'true'
        run: |
          echo "::notice::${{ matrix.branch }} ${{ matrix.country }} ${{ matrix.pack }} ${{ matrix.size }} unchanged since the last nightly build; skipped"
      - uses: actions/checkout@v5
        if: steps.seen.outputs.cache-hit != 'true'
      - uses: ./.github/actions/setup-bench
        if: steps.seen.outputs.cache-hit != 'true'
      - name: Build the snapshot
        if: steps.seen.outputs.cache-hit != 'true'
        working-directory: ${{ env.BENCH }}
        run: |
          bench demo-gen snapshot build --country "${{ matrix.country }}" --pack "${{ matrix.pack }}" \
            --size "${{ matrix.size }}" --db-root-password "$DB_ROOT_PASSWORD" --mariadb-user-host-login-scope '%'
      - name: Restore check
        if: steps.seen.outputs.cache-hit != 'true'
        working-directory: ${{ env.BENCH }}
        run: |
          # snapshot new-site checks the checksum and versions, restores and runs verify
          dump=$(ls demo-snapshots/*.sql.gz)
          bench demo-gen snapshot new-site restore-check.localhost "$PWD/$dump" \
            --admin-password restore-check --db-root-password "$DB_ROOT_PASSWORD" \
            --mariadb-user-host-login-scope '%'
      - uses: actions/upload-artifact@v6
        if: steps.seen.outputs.cache-hit != 'true'
        with:
          name: snapshot-${{ github.run_number }}-${{ matrix.branch }}-${{ matrix.country }}-${{ matrix.pack }}-${{ matrix.size }}
          path: ${{ env.BENCH }}/demo-snapshots/
          retention-days: 14
      - name: Remember this build
        if: matrix.skip_unchanged && steps.seen.outputs.cache-hit != 'true'
        run: date -u > built.txt
      - uses: actions/cache/save@v4
        if: matrix.skip_unchanged && steps.seen.outputs.cache-hit != 'true'
        with:
          path: built.txt
          key: ${{ steps.upstream.outputs.key }}
