# Electrical equipment distributor: dealers, contractor projects and a trade counter.
# Brand names in `series` are invented; none is a real manufacturer.
schema_version: 1
id: electrical_distributor
extends: india_trading
pack_version: 1
title: Electrical Equipment Distributor

company:
  industry_nouns: [Electricals, Power Solutions, Electric Distributors, Switchgear]
  warehouses: [Main Warehouse, Trade Counter]
  funding: {share_capital: 4000000, term_loan: 3000000}

parties:
  customer_nouns: [Electricals, Electrical Stores, Power Systems, Electric Works, Lighting, Contractors, Engineers, Builders]
  supplier_nouns: [Cables, Switchgear, Electricals, Lighting Industries, Fans, Wires]
  supplier_group: Electrical
  supplier_home_state_share: 0.35
  walk_in_customer: true

channels:
  - id: dealers
    share: 0.55
    party_class: b2b
    payment: {net_30: 0.6, net_45: 0.4}
    flow: [sales_order, delivery_note, sales_invoice, payment_entry]
    lines: [3, 6]
    quantity: [10, 60]
  - id: projects
    share: 0.25
    party_class: b2b
    payment: {net_30: 0.5, net_60: 0.5}
    flow: [quotation, sales_order, delivery_note, sales_invoice, payment_entry]
    lines: [2, 5]
    quantity: [20, 120]
  - id: trade_counter
    share: 0.20
    party_class: b2c
    payment: {immediate: 0.9, net_15: 0.1}
    flow: [sales_invoice, payment_entry]
    lines: [1, 3]
    quantity: [1, 10]

catalog:
  item_groups: [Switchgear, Wires and Cables, Switches and Sockets, Lighting, Fans]
  series: [Voltrix, Amperon, Lumivo, Wattara, Ohmira, Fluxen, Sparkon, Kilovex, Ventara, Glowen, Circon, Tarango,
           Nexvolt, Brilux, Coramp, Elvatra, Gridon, Helion, Insulex, Joulex, Kevlon, Lexmar, Metrova, Novolt]
  families:
    - {id: mcb,          group: Switchgear,           name_template: "{series} {rating}A {poles} MCB", options: {rating: [6, 10, 16, 20, 32], poles: [SP, DP, TP]}, count: 8, hsn: "85362030", gst_rate: 18, price_range: [180, 1400], cost_ratio: [0.62, 0.75], reorder: {min: 60, max: 400}}
    - {id: rccb,         group: Switchgear,           name_template: "{series} {rating}A RCCB", options: {rating: [25, 40, 63]}, count: 3, hsn: "85362040", gst_rate: 18, price_range: [1800, 4200], cost_ratio: [0.62, 0.75], reorder: {min: 15, max: 80}}
    - {id: db,           group: Switchgear,           name_template: "{series} {ways}-Way Distribution Board", options: {ways: [4, 8, 12, 16]}, count: 4, hsn: "85371000", gst_rate: 18, price_range: [1200, 5500], cost_ratio: [0.60, 0.72], reorder: {min: 10, max: 60}}
    - {id: wire,         group: Wires and Cables,     name_template: "{series} {size} sq mm FR Wire 90 m", options: {size: ["1.0", "1.5", "2.5", "4.0", "6.0"]}, count: 6, hsn: "85444920", gst_rate: 18, price_range: [1300, 7500], cost_ratio: [0.70, 0.82], reorder: {min: 40, max: 250}}
    - {id: switch,       group: Switches and Sockets, name_template: "{series} {amp}A Modular Switch", options: {amp: [6, 16, 20]}, count: 4, hsn: "85365090", gst_rate: 18, price_range: [45, 220], cost_ratio: [0.55, 0.70], reorder: {min: 150, max: 1000}}
    - {id: socket,       group: Switches and Sockets, name_template: "{series} {amp}A Socket", options: {amp: [6, 16]}, count: 3, hsn: "85366990", gst_rate: 18, price_range: [90, 380], cost_ratio: [0.55, 0.70], reorder: {min: 100, max: 600}}
    - {id: led_bulb,     group: Lighting,             name_template: "{series} {watt}W LED Bulb", options: {watt: [9, 12, 15, 20]}, count: 4, hsn: "85395000", gst_rate: 18, price_range: [85, 320], cost_ratio: [0.55, 0.70], reorder: {min: 200, max: 1200}}
    - {id: led_panel,    group: Lighting,             name_template: "{series} {watt}W LED Panel", options: {watt: [12, 18, 24]}, count: 3, hsn: "94051090", gst_rate: 18, price_range: [450, 1600], cost_ratio: [0.55, 0.70], reorder: {min: 40, max: 250}}
    - {id: ceiling_fan,  group: Fans,                 name_template: "{series} {size} mm Ceiling Fan", options: {size: [900, 1200, 1400]}, count: 4, hsn: "84145120", gst_rate: 18, price_range: [1900, 5800], cost_ratio: [0.65, 0.78], reorder: {min: 15, max: 90}}
    - {id: exhaust_fan,  group: Fans,                 name_template: "{series} {size} mm Exhaust Fan", options: {size: [150, 200, 250]}, count: 2, hsn: "84145190", gst_rate: 18, price_range: [900, 2600], cost_ratio: [0.65, 0.78], reorder: {min: 10, max: 60}}

behavior:
  #                 Apr  May  Jun  Jul  Aug  Sep  Oct  Nov  Dec  Jan  Feb  Mar
  seasonality: {monthly_index: [1.2, 1.3, 1.1, 0.8, 0.8, 0.9, 1.1, 1.0, 0.9, 1.0, 1.1, 1.3]}   # summer fans, year-end projects
  customer_skew: {distribution: pareto, alpha: 1.1}
  geography: {home_state_share: 0.65}
  gst_categories: {registered: 0.85, unregistered: 0.13, sez: 0.02}
