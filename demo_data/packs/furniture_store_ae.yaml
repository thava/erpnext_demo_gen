# Dubai furniture showroom with a trade (fit-out, hospitality, projects) channel.
schema_version: 1
id: furniture_store_ae
pack: furniture_store               # the UAE version of furniture_store (file ids are internal)
extends: ae_trading
pack_version: 1
title: Furniture Store (Dubai)

company:
  industry_nouns: [Furniture, Home Furnishings, Interiors, Furniture Trading]
  warehouses: [Showroom, Warehouse]
  funding: {share_capital: 1200000, term_loan: 400000}

parties:
  customer_nouns: [Interiors, Fit-Out, Hospitality, Properties, Contracting, Real Estate, Design Studio]
  supplier_nouns: [Furniture Factory, Upholstery, Woodworks, Mattress Industries, Furniture Trading]
  walk_in_customer: true

channels:
  - id: showroom
    share: 0.65
    party_class: b2c
    payment: {immediate: 0.8, net_30: 0.2}
    flow: [sales_invoice, payment_entry]
  - id: trade_projects
    share: 0.35
    party_class: b2b
    payment: {net_15: 0.3, net_30: 0.7}
    flow: [quotation, sales_order, delivery_note, sales_invoice, payment_entry]

catalog:
  item_groups: [Living Room, Bedroom, Dining, Office, Storage]
  series: [Marina, Jumeirah, Palm, Corniche, Oasis, Zahra, Noor, Yasmin, Layali, Qasr, Saray, Andalus,
           Sahara, Dana, Reem, Saadiyat, Hatta, Liwa, Bastakiya, Creekside, Mirdif, Arjan, Sufouh, Wasl,
           Furjan, Nahda, Qusais, Barsha, Karama, Satwa, Safa, Hessa, Warqa, Muhaisnah, Rashidiya, Garhoud,
           Mamzar, Khawaneej, Mizhar, Lahbab]
  families:
    - {id: sofa,         group: Living Room, name_template: "{series} {n}-Seater Sofa", options: {n: [2, 3, 5]}, count: 6, price_range: [2499, 8999], cost_ratio: [0.50, 0.62], reorder: {min: 4, max: 20}}
    - {id: armchair,     group: Living Room, name_template: "{series} Armchair",        count: 4, price_range: [899, 3299], cost_ratio: [0.50, 0.62], reorder: {min: 4, max: 16}}
    - {id: accent_chair, group: Living Room, name_template: "{series} Accent Chair",    count: 3, price_range: [499, 1599], cost_ratio: [0.48, 0.60], reorder: {min: 6, max: 30}}
    - {id: bed,          group: Bedroom,     name_template: "{series} {size} Bed", options: {size: [Single, Queen, King]}, count: 5, price_range: [1999, 6999], cost_ratio: [0.50, 0.62], reorder: {min: 2, max: 10}}
    - {id: wardrobe,     group: Bedroom,     name_template: "{series} {n}-Door Wardrobe", options: {n: [2, 3, 4]}, count: 4, price_range: [1499, 4999], cost_ratio: [0.50, 0.62], reorder: {min: 2, max: 8}}
    - {id: mattress,     group: Bedroom,     name_template: "{series} Pocket Spring Mattress", count: 4, price_range: [1299, 5499], cost_ratio: [0.45, 0.58], reorder: {min: 4, max: 20}}
    - {id: dining_set,   group: Dining,      name_template: "{series} {n}-Seater Dining Set", options: {n: [4, 6, 8]}, count: 4, price_range: [2499, 8999], cost_ratio: [0.50, 0.62], reorder: {min: 2, max: 8}}
    - {id: office_chair, group: Office,      name_template: "{series} Office Chair",    count: 5, price_range: [499, 2499], cost_ratio: [0.50, 0.62], reorder: {min: 6, max: 30}}
    - {id: office_desk,  group: Office,      name_template: "{series} Office Desk",     count: 3, price_range: [899, 3499], cost_ratio: [0.50, 0.62], reorder: {min: 3, max: 12}}
    - {id: cabinet,      group: Storage,     name_template: "{series} Storage Cabinet", count: 4, price_range: [699, 2799], cost_ratio: [0.50, 0.62], reorder: {min: 3, max: 12}}
    - {id: tv_unit,      group: Storage,     name_template: "{series} TV Unit",         count: 2, price_range: [599, 2499], cost_ratio: [0.48, 0.60], reorder: {min: 4, max: 16}}

behavior:
  seasonality: {monthly_index: [1.3, 1.0, 1.0, 0.9, 0.9, 0.8, 0.7, 0.7, 1.0, 1.0, 1.2, 1.4]}
