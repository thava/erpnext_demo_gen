# Base for Germany packs: a VAT-registered trading GmbH in Munich on the SKR04 chart.
# VAT is fixed pack data, never fetched.
schema_version: 1
id: de_trading
locale: DE                          # country: tax, addresses, names, fiscal year (demo_data/locales)
default_pack: furniture_store       # installed by --country DE when no --pack is given
abstract: true
pack_version: 1
title: Germany Trading (base, Munich)

# Umsatzsteuer: standard 19%, reduced 7% (food, books); an item's rate comes from its
# Item Tax Template. Families and supplies say `vat: reduced` for 7% (default standard).
vat: {standard: 19, reduced: 7, as_of: "2026-11-10"}

company:
  industry_nouns: [Handel]
  home_state: Bayern                # a Bundesland (--home-state BY, BE, HH, NW, ...)
  warehouses: [Stores]
  funding: {share_capital: 100000, term_loan: 0}   # GmbH: at least 25,000 share capital

parties:
  customer_nouns: [Handel, Einrichtungen, Objektbau, Immobilien, Hotels]
  supplier_nouns: [Möbelwerke, Industrie, Großhandel, Fabrik]
  customer_group: {b2b: Commercial, b2c: Individual}
  supplier_group: Distributor
  supplier_home_state_share: 0.3    # most furniture makers are elsewhere (Ostwestfalen, NRW)
  walk_in_customer: false

behavior:
  # index 0 = January: winter sale (January), slow summer, strong autumn before Christmas
  seasonality: {monthly_index: [1.1, 0.9, 1.0, 0.9, 0.9, 0.8, 0.8, 0.8, 1.0, 1.1, 1.2, 1.0]}
  customer_skew: {distribution: pareto, alpha: 1.2}
  geography: {home_state_share: 0.6}
  vat_registration: {registered: 0.9, unregistered: 0.1}   # business customers with a USt-IdNr.
  payment_outcomes: {on_time: 0.80, late: 0.15, open_overdue: 0.05}
  rates: {returns: 0.03, cancelled: 0.01, left_in_draft: 0.02}

banking:
  # Real bank names, Bankleitzahlen and BICs; account numbers are made up.
  main: {bank: Stadtsparkasse München, short: SSKM, blz: "70150000", bic: SSKMDEMMXXX}
  collection: {bank: Deutsche Bank, short: DB, blz: "70070010", bic: DEUTDEMMXXX}   # card terminal settles here
  sweep_weekday: 0            # every Monday the collection account and the cash go to the main account
  cash_floor: 20000           # lowest planned bank balance (EUR); the term loan grows in these steps
  modes:
    counter:  {Cash: 0.35, Card: 0.65}                       # girocard and credit cards; Germans still pay cash
    customer: {Wire Transfer: 0.80, Direct Debit: 0.20}      # SEPA transfer; SEPA direct debit (mandate)
    supplier: {Wire Transfer: 0.85, Direct Debit: 0.15}
  clearing_days: {Wire Transfer: [0, 1], Direct Debit: [1, 2], Card: [1, 2]}

# Own-use inventory (design 5.15); input VAT on supplies is deductible like any other.
# Expense accounts are SKR04 ledgers (account names without their numbers).
supplies:
  warehouse: Office Stores
  item_group: Office Supplies
  expense_account: Bürobedarf                        # 6815; cleaning: Reinigung (6330)
  departments: [Sales, Accounts, Warehouse]
  suppliers:
    - {nouns: [Bürobedarf, Büroversand]}
    - {nouns: [Getränke, Kaffeerösterei]}
  items:
    - {code: SUP-A4-PAPER,  name: "A4 Copier Paper (box of 5 reams)", cost: 25, use_per_month: [3, 6], reorder: {level: 4, qty: 10}}
    - {code: SUP-TONER,     name: "Laser Printer Toner Cartridge",    cost: 85, use_per_month: [1, 2], reorder: {level: 2, qty: 4}}
    - {code: SUP-PENS,      name: "Ballpoint Pens (box of 12)",       cost: 8,  use_per_month: [2, 5], reorder: {level: 4, qty: 12}}
    - {code: SUP-CLEANER,   name: "Floor Cleaner (5 L)",              cost: 15, use_per_month: [1, 3], reorder: {level: 2, qty: 6},  expense_account: Reinigung}
    - {code: SUP-BIN-BAGS,  name: "Garbage Bags (roll of 50)",        cost: 6,  use_per_month: [2, 4], reorder: {level: 3, qty: 10}, expense_account: Reinigung}
    # staff refreshments: coffee is food (7%); bottled water is 19% (only tap water is reduced)
    - {code: SUP-COFFEE,    name: "Coffee Beans (1 kg)",              cost: 18, use_per_month: [2, 4], reorder: {level: 2, qty: 8},  vat: reduced, supplier: 2, expense_account: Freiwillige soziale Aufwendungen lohnsteuerfrei}
    - {code: SUP-WATER,     name: "Mineral Water (crate of 12)",      cost: 7,  use_per_month: [8, 14], stock: false, supplier: 2, expense_account: Freiwillige soziale Aufwendungen lohnsteuerfrei}

sizes:
  micro:  {months: 3,  customers: 6,   suppliers: 3,  items: 12,  sales_invoices: 35,   purchase_invoices: 12}   # quick tests, about 1 minute
  small:  {months: 12, customers: 15,  suppliers: 8,  items: 40,  sales_invoices: 150,  purchase_invoices: 60}
  medium: {months: 24, customers: 150, suppliers: 30, items: 250, sales_invoices: 4000, purchase_invoices: 900}
