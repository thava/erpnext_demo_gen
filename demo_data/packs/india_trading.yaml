# Shared base for Indian trading businesses. Not installable on its own.
# Child packs override keys; a list replaces the base list unless the child
# writes the key with a trailing "+" (e.g. "warehouses+:"), which appends.
schema_version: 1
id: india_trading
locale: IN                         # country: tax, addresses, names, fiscal year (demo_data/locales)
default_pack: furniture_store       # installed by --country IN when no --pack is given
abstract: true
pack_version: 1
title: India Trading (base)

company:
  industry_nouns: [Traders]
  home_state: Tamil Nadu            # overridable with --home-state
  warehouses: [Stores]
  funding: {share_capital: 5000000, term_loan: 0}

parties:
  customer_nouns: [Traders, Enterprises, Agencies, Stores, Distributors]
  supplier_nouns: [Industries, Manufacturers, Suppliers, Works]
  customer_group: {b2b: Commercial, b2c: Individual}
  supplier_group: Distributor
  supplier_home_state_share: 0.5      # suppliers are spread wider than customers
  walk_in_customer: false             # one shared "Walk-in Customer" for anonymous b2c sales

behavior:
  #                 Apr  May  Jun  Jul  Aug  Sep  Oct  Nov  Dec  Jan  Feb  Mar
  seasonality: {monthly_index: [0.9, 0.9, 0.9, 1.0, 1.0, 1.0, 1.2, 1.2, 1.0, 0.9, 0.9, 1.1]}
  customer_skew: {distribution: pareto, alpha: 1.2}
  geography: {home_state_share: 0.75}
  gst_categories: {registered: 0.70, unregistered: 0.28, sez: 0.02}
  payment_outcomes: {on_time: 0.70, late: 0.20, open_overdue: 0.10}
  rates: {returns: 0.02, cancelled: 0.01, left_in_draft: 0.02}

banking:
  # The demo always creates its own bank accounts (and ledgers), even when the
  # company already has accounts at these banks; an existing Bank master is only
  # reused as the bank's name. Account numbers and IFSC codes are made up.
  main: {bank: HDFC Bank, short: HDFC, ifsc_prefix: HDFC}        # operating account at the lender bank
  collection: {bank: ICICI Bank, short: ICICI, ifsc_prefix: ICIC}  # counter UPI QR and card terminal settle here
  sweep_weekday: 0            # every Monday the collection account and the cash are moved to the main account
  upi_limit: 100000           # UPI above this falls back to a bank transfer (NEFT/RTGS)
  rtgs_from: 200000           # bank transfers from this amount go by RTGS, below by NEFT
  # Payment methods by who pays: counter = paid on the spot at the counter (UPI and
  # card into the collection account), customer = credit customers paying later,
  # supplier = our payments. All but counter UPI and card use the main account.
  modes:
    counter:  {Cash: 0.35, UPI: 0.45, Card: 0.20}
    customer: {Wire Transfer: 0.55, Cheque: 0.25, UPI: 0.20}
    supplier: {Wire Transfer: 0.80, Cheque: 0.15, UPI: 0.05}
  # Days until the bank clears a payment ([min, max]). The books are reconciled up
  # to the end of the previous month, so later payments show as uncleared.
  clearing_days: {UPI: [0, 0], Wire Transfer: [0, 1], Card: [1, 2], Cheque: [2, 5]}

# Own-use inventory (design 5.15): supplies the business keeps for itself, counted in
# their own store and reordered at their reorder level; drinking water is billed monthly.
supplies:
  warehouse: Office Stores
  item_group: Office Supplies
  expense_account: Office Maintenance Expenses      # default; stationery goes to Print and Stationery
  departments: [Sales, Accounts, Stores]
  suppliers:
    - {nouns: [Stationers, Office Supplies, Paper Mart]}
    - {nouns: [Aqua, Water Supply]}
  items:
    - {code: SUP-A4-PAPER,   name: "A4 Copier Paper (500 sheets)",   cost: 290,  use_per_month: [8, 14], reorder: {level: 10, qty: 30}, hsn: "48025690", gst_rate: 5,  expense_account: Print and Stationery}
    - {code: SUP-TONER,      name: "Laser Printer Toner Cartridge",  cost: 2400, use_per_month: [1, 2],  reorder: {level: 2, qty: 4},   hsn: "84439959", gst_rate: 18, expense_account: Print and Stationery}
    - {code: SUP-PENS,       name: "Ball Pens (box of 10)",          cost: 90,   use_per_month: [2, 5],  reorder: {level: 4, qty: 12},  hsn: "96081019", gst_rate: 18, expense_account: Print and Stationery}
    - {code: SUP-REGISTER,   name: "Long Book Register",             cost: 120,  use_per_month: [2, 4],  reorder: {level: 3, qty: 10},  hsn: "48202000", gst_rate: 18, expense_account: Print and Stationery}
    - {code: SUP-CLEANER,    name: "Floor Cleaner (5 L)",            cost: 450,  use_per_month: [1, 3],  reorder: {level: 2, qty: 6},   hsn: "34022010", gst_rate: 18}
    - {code: SUP-BIN-BAGS,   name: "Garbage Bags (pack of 30)",      cost: 160,  use_per_month: [2, 4],  reorder: {level: 3, qty: 10},  hsn: "39232100", gst_rate: 18}
    - {code: SUP-TEA,        name: "Tea Leaves (1 kg)",              cost: 520,  use_per_month: [1, 2],  reorder: {level: 1, qty: 4},   hsn: "09024020", gst_rate: 5}
    - {code: SUP-WATER-CAN,  name: "Drinking Water Can (20 L)",      cost: 60,   use_per_month: [20, 30], stock: false, supplier: 2,   hsn: "22019010", gst_rate: 5}

sizes:
  micro:  {months: 3,  customers: 6,   suppliers: 3,  items: 12,  sales_invoices: 35,   purchase_invoices: 12}   # quick tests, about 1 minute
  small:  {months: 12, customers: 15,  suppliers: 8,  items: 40,  sales_invoices: 150,  purchase_invoices: 60}
  medium: {months: 24, customers: 150, suppliers: 30, items: 250, sales_invoices: 4000, purchase_invoices: 900}
